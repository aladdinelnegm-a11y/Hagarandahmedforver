<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wedding Wishes | Ahmed & Hagar</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#fbf5ea;color:#76572e;font-family:Georgia,'Times New Roman',serif}main{max-width:760px;margin:auto;padding:45px 20px 90px;text-align:center}.eyebrow{font:12px Arial,sans-serif;letter-spacing:4px;color:#b58b4f}h1{font-size:clamp(34px,7vw,55px);font-weight:400;color:#a47b45;margin:20px 0 10px}p{line-height:1.7}.back{display:inline-block;margin-bottom:24px;color:#946b35;text-decoration:none}.panel{background:#fffdf8;border:1px solid #e7d6b6;border-radius:20px;padding:25px;text-align:left;box-shadow:0 12px 40px #9a713614}label{display:block;margin:15px 0 8px;font:600 14px Arial,sans-serif}input,textarea{width:100%;border:1px solid #ddc9a6;border-radius:10px;padding:13px;font:16px Arial,sans-serif;background:white;color:#523d24}textarea{min-height:120px;resize:vertical}button{border:0;border-radius:13px;background:linear-gradient(125deg,#b58b4f,#d5b77f 48%,#a77c40);color:white;padding:15px 24px;font:600 15px Arial,sans-serif;cursor:pointer;margin-top:18px;width:100%}button:disabled{opacity:.6;cursor:wait}#status{min-height:25px;font:14px Arial,sans-serif}h2{text-align:center;margin-top:50px;font-weight:400}.wish{padding:19px 21px;margin:15px 0;background:#fffdf8;border:1px solid #e7d6b6;border-radius:15px;overflow-wrap:anywhere}.wish strong{font:600 15px Arial,sans-serif}.wish time{float:right;font:12px Arial,sans-serif;color:#9c8b72}.wish p{white-space:pre-wrap;margin-bottom:0}.honeypot{position:absolute;left:-10000px}
</style></head><body><main><a class="back" href="./">← Back to Invitation</a><div class="eyebrow">AHMED & HAGAR</div><h1>Leave a Wish 💌</h1><p>Leave a little love for the happy couple. Your message will be visible to all guests.</p>
